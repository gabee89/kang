name: Defense checks
on:
  push:
  pull_request:
jobs:
  rules-and-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: node --check assets/client.js
      - run: node --check assets/battlefield.js
      - run: node --check assets/combat-fx.js
      - run: node --check assets/actors.js
      - run: node --check assets/element-fx.js
      - run: node --check assets/ultimate-fx.js

